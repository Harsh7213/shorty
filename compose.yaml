services:
  postgres:
    image: postgres:17-alpine
    container_name: shorty_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shorty_db}
      POSTGRES_USER: ${POSTGRES_USER:-shorty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    container_name: shorty_backend
    env_file:
      - ./backend/.env
    environment:
      PORT: "8080"
      DOMAIN: http://localhost:8080/
      DATABASE_URL: postgresql://${POSTGRES_USER:-shorty}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-shorty_db}?sslmode=disable
      PUBLIC_API_URL: http://localhost:8080
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    container_name: shorty_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
    container_name: shorty_mailpit

volumes:
  postgres_data:
