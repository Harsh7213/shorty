services:
  postgres:
    image: postgres:17-alpine
    container_name: shorty_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shorty_db}
      POSTGRES_USER: ${POSTGRES_USER:-shorty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
      start_interval: 2s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    container_name: shorty_backend
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env}
    environment:
      PORT: "8080"
      DOMAIN: ${DOMAIN:-http://localhost:8080/}
      DATABASE_URL: postgresql://${POSTGRES_USER:-shorty}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-shorty_db}?sslmode=disable
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_STARTTLS: "${SMTP_STARTTLS:-false}"
      RABBITMQ_URL: amqp://shorty:${RABBITMQ_PASSWORD:-rabbitmq_password}@rabbitmq:5672/
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    container_name: shorty_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
    container_name: shorty_mailpit

  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    container_name: shorty_rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
    environment:
      RABBITMQ_DEFAULT_USER: shorty
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq_password}
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5672 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  rabbitmq_data: