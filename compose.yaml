services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shorty_db
      POSTGRES_USER: shorty
      POSTGRES_PASSWORD: shorty_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shorty -d shorty_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      PORT: "8080"
      DOMAIN: http://localhost:8080/
      DATABASE_URL: postgres://shorty:shorty_dev_password@db:5432/shorty_db?sslmode=disable
      PUBLIC_API_URL: http://localhost:8080
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  postgres_data:
